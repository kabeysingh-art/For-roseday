<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(#1a001a, #000);
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  color: pink;
}

/* COMMON */
.page {
  width:100vw;
  height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:absolute;
}

.show { display:flex; }

/* FLOATING HEARTS */
.heart {
  position:absolute;
  color:rgba(255,105,180,0.6);
  animation: float 8s linear infinite;
}
@keyframes float {
  from { transform:translateY(100vh); }
  to { transform:translateY(-10vh); }
}

/* BUTTON */
.btn {
  margin-top:30px;
  padding:12px 35px;
  background:#ff69b4;
  color:white;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 0 20px #ff69b4;
}

/* PAGE 1 */
#page1 h1 {
  font-size:32px;
  text-align:center;
}
#heartBtn {
  font-size:80px;
  cursor:pointer;
  transition:transform 1.5s ease;
}

/* PAGE 2 */
#flower {
  width:200px;
  animation: pop 2s ease forwards;
}
@keyframes pop {
  from { transform:scale(0); }
  to { transform:scale(1); }
}
#happyText {
  font-family:'Great Vibes';
  font-size:48px;
  margin-top:20px;
}

/* PAGE 3 */
.roses {
  display:flex;
  gap:20px;
}
.rose {
  width:80px;
  cursor:pointer;
}

/* PAGE 4 */
#letter {
  width:80%;
  font-family:'Great Vibes';
  font-size:28px;
  color:#ff8acb;
  text-align:center;
  min-height:200px;
}

/* PAGE 5 */
#slideshow img {
  width:80vw;
  max-height:80vh;
  animation: zoom 3.5s ease forwards;
}
@keyframes zoom {
  from { transform:scale(0.8); opacity:0; }
  to { transform:scale(1); opacity:1; }
}
#finalText {
  position:absolute;
  bottom:30px;
  font-size:36px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page show">
  <h1>Open if you love me<br>(Sneha)</h1>
  <div id="heartBtn">❤️</div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <img src="flower.jpg" id="flower">
  <div id="happyText"></div>
  <button class="btn" onclick="nextPage(3)">Next</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <h2>Catch all the roses 🌹</h2>
  <div class="roses" id="roseBox"></div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
  <div id="letter"></div>
  <button class="btn" onclick="nextPage(5)">Next</button>
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
  <div id="slideshow"></div>
  <div id="finalText">HAPPY ROSE DAY ❤️</div>
</div>

<script>
let pages = document.querySelectorAll('.page');
function nextPage(n){
  pages.forEach(p=>p.classList.remove('show'));
  document.getElementById(`page${n}`).classList.add('show');
}

/* PAGE 1 → 2 */
document.getElementById('heartBtn').onclick = () => {
  document.getElementById('heartBtn').style.transform='scale(20)';
  setTimeout(()=>nextPage(2),1200);
};

/* TYPE TEXT */
let text="Happy Rose Day 🌹";
let i=0;
function typeHappy(){
  if(i<text.length){
    document.getElementById('happyText').innerHTML+=text.charAt(i++);
    setTimeout(typeHappy,100);
  }
}
setTimeout(typeHappy,1500);

/* ROSE GAME */
let roseBox=document.getElementById('roseBox');
let count=0;
for(let i=0;i<5;i++){
  let r=document.createElement('img');
  r.src='rose.jpg';
  r.className='rose';
  r.onclick=()=>{
    r.style.display='none';
    count++;
    if(count===5) setTimeout(()=>nextPage(4),500);
  };
  roseBox.appendChild(r);
}

/* LETTER */
let letterText=`Five months ago, on 17th August,  
I gave you a rose for the first time.  

Today, it’s Rose Day again.  
Six months apart… yet the feelings remain the same.  

We fight.  
We love.  
We grow.  

Like a rose — beautiful, strong, and rare —  
you make everything brighter.  

I promise to celebrate every Rose Day with you…  
today, tomorrow, always. ❤️`;

let l=0;
function writeLetter(){
  if(l<letterText.length){
    document.getElementById('letter').innerHTML+=letterText.charAt(l++);
    setTimeout(writeLetter,40);
  }
}
setTimeout(writeLetter,800);

/* SLIDESHOW */
let photos=['photo4.jpg','photo3.jpg','photo2.jpg','photo1.jpg'];
let s=0;
function showSlide(){
  if(s<photos.length){
    document.getElementById('slideshow').innerHTML=
      `<img src="${photos[s++]}">`;
    setTimeout(showSlide,3500);
  }
}
setTimeout(showSlide,500);
</script>

</body>
</html>
