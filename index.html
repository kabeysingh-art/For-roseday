<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Georgia',serif}
body{
  background:radial-gradient(circle at top,#2b0015,#000);
  color:#fff;
  overflow:hidden;
  text-align:center;
}

/* COMMON */
.page{
  display:none;
  position:absolute;
  inset:0;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
}
.active{display:flex}
button{
  padding:14px 28px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff3366,#ff99aa);
  color:#000;
  font-size:18px;
  cursor:pointer;
  margin-top:25px;
  transition:.3s;
}
button:hover{transform:scale(1.08)}

/* MAGIC HEARTS */
.heart{
  position:absolute;
  color:pink;
  animation:float 6s linear infinite;
  opacity:.6;
}
@keyframes float{
  from{transform:translateY(100vh) scale(.5)}
  to{transform:translateY(-10vh) scale(1.2)}
}

/* PAGE 1 */
#p1 h1{
  font-size:38px;
  text-shadow:0 0 15px pink;
}
#p1 img{
  width:120px;
  border-radius:15px;
  margin:10px;
  box-shadow:0 0 20px rgba(255,105,180,.5);
}

/* PAGE 2 HEART */
#p2{
  background:#000;
  animation:zoomIn 1.8s ease forwards;
}
@keyframes zoomIn{
  from{transform:scale(.6)}
  to{transform:scale(1)}
}
#bigHeart{
  font-size:160px;
  animation:pulse 2s infinite ease-in-out;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}
#rose{
  width:180px;
  margin-top:-30px;
}

/* PAGE 3 ROSE GAME */
.rose{
  position:absolute;
  width:90px;
  cursor:pointer;
  animation:drift 6s alternate infinite;
}
@keyframes drift{
  from{transform:translateX(-40px)}
  to{transform:translateX(40px)}
}

/* LETTER */
#letter{
  max-width:800px;
  background:rgba(255,255,255,.1);
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 25px pink;
  font-size:18px;
  line-height:1.7;
}
.cursor{border-right:2px solid pink}

/* SLIDESHOW */
#slide{
  width:75%;
  max-width:420px;
  border-radius:20px;
  box-shadow:0 0 30px pink;
  animation:zoomPhoto 4s infinite;
}
@keyframes zoomPhoto{
  0%{transform:scale(.7);opacity:0}
  20%{opacity:1}
  50%{transform:scale(1)}
  80%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
  <h1>If you love me ❤️</h1>
  <p>Click to open something magical</p>
  <img src="photo1.jpg"><img src="photo2.jpg">
  <button onclick="go(2)">Open the special day</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
  <div id="bigHeart">❤️</div>
  <img id="rose" src="flower.jpg">
  <p>Happy Rose Day</p>
  <button onclick="go(3)">Catch the roses</button>
</div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">
  <h2>Catch all the roses 🌹</h2>
</div>

<!-- PAGE 4 LETTER -->
<div class="page" id="p4">
  <div id="letter"><span id="text"></span><span class="cursor"></span></div>
  <button onclick="go(5)">Next</button>
</div>

<!-- PAGE 5 PHOTOS -->
<div class="page" id="p5">
  <img id="slide" src="photo1.jpg">
  <h2>Happy Rose Day ❤️</h2>
</div>

<script>
/* PAGE SWITCH */
function go(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  if(n===3)startGame();
  if(n===4)typeLetter();
  if(n===5)slideShow();
}

/* FLOATING HEARTS */
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤️';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=Math.random()*20+15+'px';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},500);

/* ROSE GAME */
let caught=0;
function startGame(){
  caught=0;
  for(let i=0;i<4;i++){
    const r=document.createElement('img');
    r.src='rose.jpg';
    r.className='rose';
    r.style.left=Math.random()*80+'%';
    r.style.top=Math.random()*70+'%';
    r.onclick=()=>{
      r.remove(); caught++;
      if(caught===4)go(4);
    };
    document.getElementById('p3').appendChild(r);
  }
}

/* LETTER TYPE */
const letter=`Five months have passed…
And now we are stepping into the sixth.

Five months ago — on the 17th of August —
I gave you a rose for the first time.

Today, it is Rose Day again.

If you notice…
It’s been exactly six months
since that first rose.

So much has happened in between.
We fight.
We fight a lot.
But we also love… even more.

Every fight, every smile,
every misunderstanding and every hug
has only made our bond stronger.

You are like a rose —
soft, beautiful,
and strong enough to survive every storm.

I want to keep giving you roses.
Not just today.
Not just on Rose Day.

But in every phase of life,
every year,
every version of us.

Happy Rose Day ❤️`;

let i=0;
function typeLetter(){
  i=0;
  document.getElementById('text').innerHTML='';
  const t=setInterval(()=>{
    document.getElementById('text').innerHTML+=letter[i];
    i++;
    if(i>=letter.length)clearInterval(t);
  },40);
}

/* SLIDESHOW */
const photos=['photo1.jpg','photo2.jpg','photo3.jpg','photo4.jpg'];
let idx=0;
function slideShow(){
  setInterval(()=>{
    document.getElementById('slide').src=photos[idx%photos.length];
    idx++;
  },4000);
}
</script>

</body>
</html>
