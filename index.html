<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body {
  background: radial-gradient(circle at top, #ffb6c1, #1a001a);
  overflow:hidden;
  color:#fff;
  text-align:center;
}

/* COMMON */
.page {
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:absolute;
}
.page.active { display:flex; animation:fadeIn 1.2s ease; }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* HEARTS */
.heart {
  position:absolute;
  color:pink;
  font-size:20px;
  animation: floatUp linear infinite;
  opacity:0.7;
}
@keyframes floatUp {
  from { transform:translateY(100vh); }
  to { transform:translateY(-10vh); }
}

/* PAGE 1 */
#page1 h1 { font-size:2.5rem; margin-bottom:20px; }
#page1 button {
  padding:15px 30px;
  border:none;
  border-radius:30px;
  font-size:1.1rem;
  background:#ff4f8b;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px #ff4f8b;
}

/* PAGE 2 */
#heart {
  width:200px;
  height:180px;
  background:red;
  position:relative;
  transform:rotate(-45deg);
  animation:pulse 1.5s infinite;
}
#heart:before, #heart:after {
  content:'';
  width:200px;
  height:200px;
  background:red;
  border-radius:50%;
  position:absolute;
}
#heart:before { top:-100px; left:0; }
#heart:after { left:100px; top:0; }

@keyframes pulse {
  0%,100% { transform:scale(1) rotate(-45deg); }
  50% { transform:scale(1.15) rotate(-45deg); }
}

/* PAGE 3 ROSE GAME */
.rose {
  position:absolute;
  width:70px;
  cursor:pointer;
  animation:floatRose 6s infinite alternate;
}
@keyframes floatRose {
  from { transform:translateY(0); }
  to { transform:translateY(-200px); }
}

/* LETTER */
#letter {
  width:85%;
  max-width:600px;
  background:rgba(255,255,255,0.1);
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 30px pink;
}
#letter p {
  color:#ff9ecb;
  font-size:1.1rem;
  line-height:1.7;
  text-align:left;
  min-height:200px;
}

/* SLIDESHOW */
#slideshow img {
  width:80%;
  max-width:350px;
  border-radius:20px;
  position:absolute;
  opacity:0;
  animation:slideShow 12s infinite;
}
#slideshow img:nth-child(1){animation-delay:0s}
#slideshow img:nth-child(2){animation-delay:3s}
#slideshow img:nth-child(3){animation-delay:6s}
#slideshow img:nth-child(4){animation-delay:9s}

@keyframes slideShow {
  0%{opacity:0; transform:scale(0.7)}
  10%{opacity:1; transform:scale(1)}
  40%{opacity:1}
  50%{opacity:0}
  100%{opacity:0}
}

/* FINAL */
#final h1 {
  font-size:3rem;
  color:#ff4f8b;
  text-shadow:0 0 20px pink;
}
#final p { opacity:0.3; margin-top:20px; }

</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <h1>If you love me ❤️</h1>
  <button onclick="go(2)">Click here for the special day</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div id="heart" onclick="go(3)"></div>
  <p style="margin-top:20px">Tap the heart 💗</p>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h1>Happy Rose Day 🌹</h1>
  <p>Catch all the roses</p>
</div>

<!-- PAGE 4 LETTER -->
<div class="page" id="page4">
  <div id="letter">
    <p id="typing"></p>
  </div>
  <button onclick="go(5)" style="margin-top:20px">Next</button>
</div>

<!-- PAGE 5 SLIDESHOW -->
<div class="page" id="page5">
  <div id="slideshow">
    <img src="photo4.jpg">
    <img src="photo3.jpg">
    <img src="photo2.jpg">
    <img src="photo1.jpg">
  </div>
  <button onclick="go(6)" style="margin-top:300px">Next</button>
</div>

<!-- FINAL -->
<div class="page" id="final">
  <h1>Happy Rose Day 🌹</h1>
  <img src="rose.jpg" width="200">
  <p>I Love You</p>
</div>

<script>
/* PAGE CONTROL */
function go(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+n)?.classList.add('active');
  if(n===3) spawnRoses();
  if(n===4) typeLetter();
}

/* HEARTS */
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(15+Math.random()*20)+'px';
  h.style.animationDuration=(4+Math.random()*4)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},400);

/* ROSE GAME */
let caught=0;
function spawnRoses(){
  caught=0;
  for(let i=0;i<4;i++){
    const r=document.createElement('img');
    r.src='rose.jpg';
    r.className='rose';
    r.style.left=(10+Math.random()*80)+'vw';
    r.style.top=(50+Math.random()*200)+'px';
    r.onclick=()=>{
      r.remove();
      caught++;
      if(caught===4) setTimeout(()=>go(4),800);
    };
    document.getElementById('page3').appendChild(r);
  }
}

/* TYPING LETTER */
const letterText=`Five months ago, on the 17th of August, I gave you a rose.
Today, it’s almost six months later — and it still feels magical.

We fight. We love. We grow.
Every moment shapes our bond deeper.

You are like a rose — soft, strong, beautiful.
And I want to celebrate every Rose Day with you.

Always yours.`;

let i=0;
function typeLetter(){
  const el=document.getElementById('typing');
  el.innerHTML='';
  i=0;
  const t=setInterval(()=>{
    el.innerHTML+=letterText.charAt(i);
    i++;
    if(i>=letterText.length) clearInterval(t);
  },40);
}
</script>

</body>
</html>
